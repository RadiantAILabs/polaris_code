# cargo-deny configuration. Run with `cargo deny check`.
#
# Without an explicit allowlist, `cargo deny check licenses` rejects every
# crate, so this file pins the SPDX set actually present in the tree.

[licenses]
# Permissive licenses present across the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # `webpki-root-certs` bundles Mozilla's CA set under this permissive
    # community data license (transitive via reqwest's TLS verifier).
    "CDLA-Permissive-2.0",
    # Weak (file-level) copyleft: `option-ext` (transitive via `dirs`) ships
    # under MPL-2.0 and is used unmodified, which an Apache-2.0 work may embed.
    "MPL-2.0",
]
confidence-threshold = 0.8

[advisories]
# Deny crates with known security advisories; warn on unmaintained ones.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
